services:
  postgres:
    image: postgres:16-alpine
    container_name: finansimple-postgres
    environment:
      POSTGRES_USER: finansimple
      POSTGRES_PASSWORD: finansimple
      POSTGRES_DB: finansimple
    ports:
      - '5432:5432'
    volumes:
      - finansimple_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finansimple -d finansimple']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finansimple_pgdata:
